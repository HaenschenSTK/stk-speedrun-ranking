<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="SuperTuxKart speedrun rankings across every track. Explore player points, world-record reigns, and the STK Hall of Fame.">
  <title>Player ranking · STK Rankings</title>
  <link rel="icon" href="./assets/pidginicon.png" type="image/png" sizes="128x128">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand route-link" href="#ranking"><span>STK</span> Rankings</a>
      <nav aria-label="Main navigation">
        <a class="route-link" data-view="ranking" href="#ranking" aria-current="page">Player ranking</a>
        <a class="route-link" data-view="tracks" href="#tracks">Tracks</a>
        <a class="route-link" data-view="hall" href="#hall">Hall of Fame</a>
        <a class="route-link" data-view="rules" href="#rules">How it works</a>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <p class="eyebrow">SuperTuxKart · 1.x individual levels</p>
    <h1>Player ranking</h1>
    <p role="status" id="loading">Loading rankings…</p>
    <noscript><p>Enable JavaScript to explore the rankings and player profiles. You can also <a href="./data/rankings.json">download the ranking data</a>.</p></noscript>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div>Community rankings · Runs from <a href="https://www.speedrun.com/stk">speedrun.com</a></div>
      <div id="freshness"></div>
      <a href="./data/rankings.json" download>Download data (JSON)</a>
    </div>
  </footer>
  <p id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
</body>
</html>

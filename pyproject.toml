[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stk-rankings"
version = "0.1.0"
description = "A small local archive of SuperTuxKart speedrun.com runs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stk-rankings = "stk_rankings.__main__:main"

[tool.setuptools.packages.find]
include = ["stk_rankings*"]

[tool.setuptools.package-data]
stk_rankings = ["schema.sql"]

